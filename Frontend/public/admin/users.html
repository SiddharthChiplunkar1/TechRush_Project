<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Admin - Users</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>body{font-family:Arial;padding:20px} .card{border:1px solid #ddd;padding:12px;margin:12px 0;border-radius:6px} input,button{padding:8px;margin:6px}</style>
  </head>
  <body>
    <h1>Admin - Users</h1>
    <div class="card">
      <input id="query" placeholder="Search email" />
      <button onclick="search()">Search</button>
      <pre id="out"></pre>
    </div>
    <script>
      const API = (location.protocol + '//' + location.hostname + ':8080');
      axios.defaults.baseURL = API; axios.defaults.withCredentials = true;
      async function search(){ const q=document.getElementById('query').value; try{ const r=await axios.get('/api/admin/users', { params:{ q }}); document.getElementById('out').innerText = JSON.stringify(r.data,null,2);}catch(e){document.getElementById('out').innerText = e.response?JSON.stringify(e.response.data):e.message} }
    </script>
  </body>
</html>
