<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TechRush - Banking Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
      body{font-family:Arial,Helvetica,sans-serif;padding:20px}
      input,button{padding:8px;margin:6px}
      .card{border:1px solid #ddd;padding:12px;margin:12px 0;border-radius:6px}
    </style>
  </head>
  <body>
    <h1>Banking Demo</h1>
    <div class="card">
      <h3>Get Balance</h3>
      <input id="balanceUser" placeholder="User ID (e.g., alice@example.com)" />
      <button onclick="getBalance()">Get Balance</button>
      <pre id="balanceResult"></pre>
    </div>

    <div class="card">
      <h3>Transfer Money</h3>
      <input id="fromUser" placeholder="From User ID" />
      <input id="toUser" placeholder="To User ID" />
      <input id="amount" placeholder="Amount" />
      <button onclick="transfer()">Initiate Transfer</button>
      <pre id="transferResult"></pre>
    </div>

    <div class="card">
      <h3>Confirm Transfer</h3>
      <input id="transferId" placeholder="Transfer ID" />
      <select id="confirm">
        <option value="true">Confirm</option>
        <option value="false">Cancel</option>
      </select>
      <button onclick="confirmTransfer()">Confirm</button>
      <pre id="confirmResult"></pre>
    </div>

    <div class="card">
      <h3>Transaction History</h3>
      <input id="historyUser" placeholder="User ID" />
      <button onclick="getHistory()">Get History</button>
      <pre id="historyResult"></pre>
    </div>

    <script>
      const API = (window.API_BASE = (location.protocol + '//' + location.hostname + ':8080'));
      axios.defaults.baseURL = API;
      axios.defaults.withCredentials = true;

      async function getBalance(){
        const user = document.getElementById('balanceUser').value;
        try{
          const res = await axios.get('/api/banking/balance', { params: { userId: user } });
          document.getElementById('balanceResult').innerText = JSON.stringify(res.data, null, 2);
        } catch(e){ document.getElementById('balanceResult').innerText = e.response ? JSON.stringify(e.response.data) : e.message; }
      }

      async function transfer(){
        const from = document.getElementById('fromUser').value;
        const to = document.getElementById('toUser').value;
        const amount = document.getElementById('amount').value;
        try{
          const res = await axios.post('/api/banking/transfer', { fromUserId: from, toUserId: to, amount });
          document.getElementById('transferResult').innerText = JSON.stringify(res.data, null, 2);
        } catch(e){ document.getElementById('transferResult').innerText = e.response ? JSON.stringify(e.response.data) : e.message; }
      }

      async function confirmTransfer(){
        const id = document.getElementById('transferId').value;
        const confirm = document.getElementById('confirm').value === 'true';
        try{
          const res = await axios.post('/api/banking/transfer/confirm', { transferId: id, confirm });
          document.getElementById('confirmResult').innerText = JSON.stringify(res.data, null, 2);
        } catch(e){ document.getElementById('confirmResult').innerText = e.response ? JSON.stringify(e.response.data) : e.message; }
      }

      async function getHistory(){
        const user = document.getElementById('historyUser').value;
        try{
          const res = await axios.get('/api/banking/transactions', { params: { userId: user } });
          document.getElementById('historyResult').innerText = JSON.stringify(res.data, null, 2);
        } catch(e){ document.getElementById('historyResult').innerText = e.response ? JSON.stringify(e.response.data) : e.message; }
      }
    </script>
  </body>
</html>
