<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TechRush SPA</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/dayjs/dayjs.min.js"></script>
    <style>
      body{font-family:Inter,InterVar,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;margin:0;padding:0}
      header{background:#0b5fff;color:#fff;padding:12px}
      .container{padding:20px}
      nav a{color:#fff;margin-right:12px}
      .card{border:1px solid #e5e7eb;padding:16px;border-radius:8px;margin-bottom:12px}
      input,select,button,textarea{padding:8px;margin:6px 0;width:100%;max-width:420px}
      .row{display:flex;gap:12px;flex-wrap:wrap}
      .small{width:160px}
      pre{background:#f8fafc;padding:12px;border-radius:6px}
    </style>
  </head>
  <body>
    <header>
      <nav>
        <a href="#/">Dashboard</a>
        <a href="#/balance">Balance</a>
        <a href="#/transfer">Transfer</a>
        <a href="#/transactions">Transactions</a>
        <a href="#/beneficiaries">Beneficiaries</a>
        <a href="#/face-enroll">Face Enroll</a>
        <a href="#/notifications">Notifications</a>
        <a href="#/admin/users">Admin</a>
      </nav>
    </header>

    <div id="root" class="container"></div>

    <script>
      const e = React.createElement;
      const {useState, useEffect, useRef} = React;

      axios.defaults.baseURL = (location.protocol + '//' + location.hostname + ':8080');
      axios.defaults.withCredentials = true;

      // ----------------- bankingService (simple wrapper) -----------------
      const bankingService = {
        async getBalance(){
          const res = await axios.get('/api/banking/balance', { params: { userId: window.localStorage.getItem('demo_user') || '' } });
          return res.data;
        },
        async initiateTransfer(payload){
          const res = await axios.post('/api/banking/transfer', payload);
          return res.data;
        },
        async confirmTransfer(payload){
          const res = await axios.post('/api/banking/transfer/confirm', payload);
          return res.data;
        },
        async transactions(userId){
          const res = await axios.get('/api/banking/transactions', { params: { userId } });
          return res.data;
        },
        async beneficiaries(userId){
          const res = await axios.get('/api/banking/beneficiaries', { params: { userId } });
          return res.data;
        },
        async addBeneficiary(dto){
          const res = await axios.post('/api/banking/beneficiaries', dto);
          return res.data;
        },
        async deleteBeneficiary(id){
          const res = await axios.delete('/api/banking/beneficiaries/' + id);
          return res.data;
        }
      };

      // ----------------- small auth helper -----------------
      function setDemoUser(email){ window.localStorage.setItem('demo_user', email); }
      function getDemoUser(){ return window.localStorage.getItem('demo_user') || ''; }

      // ----------------- Components -----------------

      function Dashboard(){
        const [balance, setBalance] = useState(null);
        const [txs, setTxs] = useState([]);
        const [user, setUser] = useState(getDemoUser());

        useEffect(()=>{
          if(!user) return;
          bankingService.getBalance().then(d=>setBalance(d)).catch(()=>{});
          bankingService.transactions(user).then(list=>setTxs(list.slice(0,5))).catch(()=>{});
        },[user]);

        return e('div', null,
          e('h2', null, 'Dashboard'),
          e('div', {className:'card'},
            e('div', null, 'Demo user (enter your registered email):'),
            e('input',{placeholder:'you@example.com', defaultValue:user, onBlur: (ev)=>{ setDemoUser(ev.target.value); setUser(ev.target.value);} }),
            e('div', null, balance ? e('pre', null, JSON.stringify(balance, null, 2)) : e('div', null, 'No balance loaded'))
          ),
          e('div', {className:'card'},
            e('h3', null, 'Recent Transactions'),
            txs.length ? txs.map(t => e('div', {key:t.transactionId, style:{borderBottom:'1px solid #eee',padding:'8px 0'}},
              e('div', null, t.transactionId + ' - ' + t.status),
              e('div', null, t.amount + ' — ' + new Date(t.createdAt).toLocaleString())
            )) : e('div', null, 'No transactions')
          )
        );
      }

      function BalancePage(){
        const [user, setUser] = useState(getDemoUser());
        const [balance, setBalance] = useState(null);
        async function load(){ try{ const b = await bankingService.getBalance(); setBalance(b);}catch(e){ alert('Failed: '+(e.response?JSON.stringify(e.response.data):e.message)); }}
        return e('div', null,
          e('h2', null, 'Balance'),
          e('div',{className:'card'},
            e('input',{placeholder:'Your email', defaultValue:user, onBlur:(ev)=>{ setDemoUser(ev.target.value); setUser(ev.target.value);} }),
            e('button',{onClick:load}, 'Load Balance'),
            balance && e('pre',null, JSON.stringify(balance, null,2))
          )
        );
      }

      function TransferPage(){
        const [from,setFrom]=useState(getDemoUser());
        const [to,setTo]=useState('');
        const [amount,setAmount]=useState('');
        const [desc,setDesc]=useState('');
        const [result,setResult]=useState(null);
        const [pendingId,setPendingId]=useState(null);

        async function initiate(){
          try{
            const r = await bankingService.initiateTransfer({ fromUserId: from, toUserId: to, amount: parseFloat(amount), description: desc });
            setResult(r);
            setPendingId(r.transferId);
            // navigate to confirm
            window.location.hash = '#/transfer/confirm?tid=' + r.transferId;
          }catch(e){ alert('Transfer failed: '+(e.response?JSON.stringify(e.response.data):e.message)); }
        }

        return e('div', null,
          e('h2', null, 'Transfer Money'),
          e('div',{className:'card'},
            e('input',{placeholder:'From (your email)', defaultValue:from, onBlur:(ev)=>{ setDemoUser(ev.target.value); setFrom(ev.target.value);}}),
            e('input',{placeholder:'To (recipient email)', value:to, onChange:(e)=>setTo(e.target.value)}),
            e('input',{placeholder:'Amount', value:amount, onChange:(e)=>setAmount(e.target.value)}),
            e('input',{placeholder:'Description', value:desc, onChange:(e)=>setDesc(e.target.value)}),
            e('button',{onClick:initiate}, 'Initiate Transfer'),
            result && e('pre', null, JSON.stringify(result, null,2))
          )
        );
      }

      function ConfirmTransfer(){
        const params = new URLSearchParams(location.hash.split('?')[1]);
        const tid = params.get('tid');
        const [status,setStatus]=useState(null);
        async function confirm(){
          try{ const r = await bankingService.confirmTransfer({ transferId: tid, confirm: true }); setStatus(r); window.location.hash = '#/transfer/success?tid=' + tid; }catch(e){ alert('Confirm failed: '+(e.response?JSON.stringify(e.response.data):e.message)); }
        }
        async function cancel(){ try{ const r = await bankingService.confirmTransfer({ transferId: tid, confirm: false }); setStatus(r); alert('Cancelled'); }catch(e){ alert('Cancel failed'); }}
        return e('div', null,
          e('h2', null, 'Confirm Transfer'),
          e('div',{className:'card'}, e('div', null, 'Transfer ID: '+tid), e('button',{onClick:confirm}, 'Confirm'), e('button',{onClick:cancel}, 'Cancel'), status && e('pre', null, JSON.stringify(status,null,2)))
        );
      }

      function TransferSuccess(){
        const params = new URLSearchParams(location.hash.split('?')[1]);
        const tid = params.get('tid');
        return e('div', null, e('h2', null, 'Transfer Success'), e('div',{className:'card'}, e('div', null, 'Transfer completed: '+tid), e('a',{href:'#/transactions'}, 'View Transactions')));
      }

      function Transactions(){
        const [user,setUser]=useState(getDemoUser());
        const [list,setList]=useState([]);
        async function load(){ try{ const r = await bankingService.transactions(user); setList(r);}catch(e){ alert('Failed'); }}
        return e('div', null,
          e('h2', null, 'Transactions'),
          e('div',{className:'card'}, e('input',{placeholder:'User email', defaultValue:user, onBlur:(ev)=>{ setDemoUser(ev.target.value); setUser(ev.target.value);} }), e('button',{onClick:load}, 'Load')),
          e('div', {className:'card'}, list.length ? list.map(t=> e('div',{key:t.transactionId, style:{borderBottom:'1px solid #eee',padding:'8px 0'}}, e('div', null, t.transactionId + ' • ' + t.status), e('div', null, t.amount + ' • ' + new Date(t.createdAt).toLocaleString()))) : e('div', null, 'No transactions'))
        );
      }

      function Beneficiaries(){
        const [user,setUser]=useState(getDemoUser());
        const [list,setList]=useState([]);
        const [name,setName]=useState('');
        const [acct,setAcct]=useState('');
        async function load(){ try{ const r=await bankingService.beneficiaries(user); setList(r);}catch(e){alert('Fail')} }
        async function add(){ try{ const dto={ name, accountIdentifier: acct, favourite:false, id: user }; const res=await bankingService.addBeneficiary(dto); setName(''); setAcct(''); load(); }catch(e){alert('Fail add')} }
        async function remove(id){ try{ await bankingService.deleteBeneficiary(id); load(); }catch(e){alert('Fail remove')} }
        return e('div', null,
          e('h2', null, 'Beneficiaries'),
          e('div',{className:'card'}, e('input',{placeholder:'Your email', defaultValue:user, onBlur:(ev)=>{ setDemoUser(ev.target.value); setUser(ev.target.value);} }), e('button',{onClick:load}, 'Load')),
          e('div',{className:'card'}, e('h3', null, 'Add'), e('input',{placeholder:'Name', value:name, onChange:e=>setName(e.target.value)}), e('input',{placeholder:'Account (email)', value:acct, onChange:e=>setAcct(e.target.value)}), e('button',{onClick:add}, 'Add')),
          e('div',{className:'card'}, list.length ? list.map(b=> e('div',{key:b.id, style:{borderBottom:'1px solid #eee',padding:'8px 0'}}, e('div', null, b.name + ' • ' + b.accountIdentifier), e('button',{onClick:()=>remove(b.id)}, 'Delete'))) : e('div', null, 'No beneficiaries'))
        );
      }

      // Face Enrollment component using getUserMedia
      function FaceEnroll(){
        const videoRef = useRef();
        const canvasRef = useRef();
        const [status,setStatus] = useState('idle');
        const [user,setUser] = useState(getDemoUser());
        let streamRef = useRef(null);

        useEffect(()=>{ return ()=>{ if(streamRef.current) streamRef.current.getTracks().forEach(t=>t.stop()); } },[]);

        async function start(){ try{ const s = await navigator.mediaDevices.getUserMedia({ video:true }); streamRef.current = s; videoRef.current.srcObject = s; await videoRef.current.play(); setStatus('ready'); }catch(e){ setStatus('error: '+e.message);} }
        function stop(){ if(streamRef.current){ streamRef.current.getTracks().forEach(t=>t.stop()); streamRef.current=null; videoRef.current.srcObject=null; setStatus('stopped'); } }
        async function capture(){ setStatus('capturing'); const canvas = canvasRef.current; const video = videoRef.current; canvas.width=320; canvas.height=240; const ctx = canvas.getContext('2d'); ctx.drawImage(video,0,0,canvas.width,canvas.height); const data = canvas.toDataURL('image/jpeg'); const b64 = data.split(',')[1]; setStatus('uploading'); try{ const res = await axios.post('/api/face/enroll', { image_base64: b64 }, { headers: { 'X-User-Id': user } }); setStatus('success'); }catch(e){ setStatus('failed: '+(e.response?JSON.stringify(e.response.data):e.message)); } }

        return e('div', null,
          e('h2', null, 'Face Enrollment'),
          e('div',{className:'card'}, e('input',{placeholder:'Your user email', defaultValue:user, onBlur:(ev)=>{ setDemoUser(ev.target.value); setUser(ev.target.value);} }), e('div', null, e('video',{ref:videoRef, width:320, height:240})), e('div', null, e('canvas',{ref:canvasRef, style:{display:'none'}})), e('div', null, e('button',{onClick:start}, 'Start Camera'), e('button',{onClick:capture}, 'Capture & Enroll'), e('button',{onClick:stop}, 'Stop')), e('div', null, 'Status: ' + status))
        );
      }

      // Notifications center
      function Notifications(){
        const [user,setUser]=useState(getDemoUser());
        const [list,setList]=useState([]);
        async function load(){ try{ const r = await axios.get('/api/notifications', { params: { userId: user } }); setList(r.data);}catch(e){alert('fail')} }
        async function markRead(id){ try{ await axios.patch('/api/notifications/'+id+'/read'); load(); }catch(e){alert('fail')} }
        async function del(id){ try{ await axios.delete('/api/notifications/'+id); load(); }catch(e){alert('fail')} }
        return e('div', null,
          e('h2', null, 'Notifications'),
          e('div',{className:'card'}, e('input',{placeholder:'Your email', defaultValue:user, onBlur:(ev)=>{ setDemoUser(ev.target.value); setUser(ev.target.value);} }), e('button',{onClick:load}, 'Load')),
          e('div',{className:'card'}, list.length ? list.map(n=> e('div',{key:n.id, style:{borderBottom:'1px solid #eee',padding:'8px 0'}}, e('div', null, new Date(n.createdAt).toLocaleString() + ' • ' + n.type), e('div', null, n.message), e('div', null, e('button',{onClick:()=>markRead(n.id)}, 'Mark Read'), e('button',{onClick:()=>del(n.id)}, 'Delete')))) : e('div', null, 'No notifications'))
        );
      }

      // Admin Users simple
      function AdminUsers(){
        const [q,setQ]=useState('');
        const [res,setRes]=useState([]);
        async function search(){ try{ const r = await axios.get('/api/admin/users', { params: { q } }); setRes(r.data);}catch(e){alert('fail')} }
        return e('div', null, e('h2', null, 'Admin - Users'), e('div',{className:'card'}, e('input',{placeholder:'query', value:q, onChange:e=>setQ(e.target.value)}), e('button',{onClick:search}, 'Search'), e('pre',null, JSON.stringify(res,null,2))));
      }

      // Router
      function App(){
        const [route, setRoute] = useState(location.hash || '#/');
        useEffect(()=>{ const onHash=()=>setRoute(location.hash||'#/'); window.addEventListener('hashchange', onHash); return ()=>window.removeEventListener('hashchange', onHash); },[]);
        let el = null;
        if(route.startsWith('#/transfer/confirm')) el = e(ConfirmTransfer);
        else if(route.startsWith('#/transfer/success')) el = e(TransferSuccess);
        else if(route.startsWith('#/transfer')) el = e(TransferPage);
        else if(route.startsWith('#/balance')) el = e(BalancePage);
        else if(route.startsWith('#/transactions')) el = e(Transactions);
        else if(route.startsWith('#/beneficiaries')) el = e(Beneficiaries);
        else if(route.startsWith('#/face-enroll')) el = e(FaceEnroll);
        else if(route.startsWith('#/notifications')) el = e(Notifications);
        else if(route.startsWith('#/admin')) el = e(AdminUsers);
        else el = e(Dashboard);
        return e('div', null, el);
      }

      ReactDOM.createRoot(document.getElementById('root')).render(e(App));
    </script>
  </body>
</html>
