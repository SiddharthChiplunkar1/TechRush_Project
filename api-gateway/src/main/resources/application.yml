server:
  port: 8080

  tomcat:
    max-http-form-post-size: 2MB
    max-http-request-header-size: 16KB

spring:
  application:
    name: api-gateway

  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true

gateway:
  auth-url: ${AUTH_SERVICE_URL}
  banking-url: ${BANKING_SERVICE_URL}
  face-url: ${FACEID_SERVICE_URL}

  face-service-token: ${FACEID_SERVICE_TOKEN}

  allowed-origins: ${CORS_ALLOWED_ORIGINS}

  connect-timeout-millis: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
  read-timeout-millis: ${GATEWAY_READ_TIMEOUT_MS:10000}

  max-requests-per-minute: ${GATEWAY_MAX_REQUESTS_PER_MINUTE:120}

logging:
  level:
    com.passwordlessauth.apigateway: INFO