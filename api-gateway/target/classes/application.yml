spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      mvc:
        routes:
          # ─── Auth Service ──────────────────────────────────────────────────
          - id: auth-service
            uri: http://localhost:8081
            predicates:
              - Path=/api/auth/**
          # ─── User endpoints (served by auth-service) ──────────────────────
          - id: user-service
            uri: http://localhost:8081
            predicates:
              - Path=/api/users/**
          # ─── Device endpoints (served by auth-service) ─────────────────────
          - id: device-service
            uri: http://localhost:8081
            predicates:
              - Path=/api/devices/**
          # ─── Admin endpoints (served by auth-service) ──────────────────────
          - id: admin-service
            uri: http://localhost:8081
            predicates:
              - Path=/api/admin/**
          # ─── Banking Service ───────────────────────────────────────────────
          - id: banking-service
            uri: http://localhost:8082
            predicates:
              - Path=/api/banking/**
          # ─── FaceID Service ────────────────────────────────────────────────
          - id: faceid-service
            uri: http://localhost:8000
            predicates:
              - Path=/api/face/**

server:
  port: 8080
