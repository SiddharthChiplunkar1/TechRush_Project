server:
  port: 8080

cors:
  allowed:
    origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4173,http://localhost:5173}

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:localhost}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:1025}}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
    from: ${MAIL_FROM:noreply@techrush.dev}

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
    issuer: TechRush
    audience: techrush-app
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5173/login/google}
  faceid:
    url: ${FACEID_SERVICE_URL:http://localhost:8000}
    service-token: ${FACEID_SERVICE_TOKEN:dev-faceid-service-token}
  security:
    internal-service-token: ${INTERNAL_SERVICE_TOKEN:}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    max-failed-login-attempts: 10
    account-lock-duration-minutes: 30
    otp-resend-cooldown-seconds: 60

logging:
  level:
    com.passwordlessauth: INFO
    org.springframework.security: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
