    secret: dGVjaHJ1c2gtZGV2LXNlY3JldC1rZXktZm9yLWxvY2FsLWRldmVsb3BtZW50LW9ubHk=
    issuer: TechRush
    audience: techrush-app

  banking:
    step-up-threshold: 1000.00
