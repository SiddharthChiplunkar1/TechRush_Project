services:
  postgres-auth:
    image: postgres:16-alpine
    container_name: passwordless-postgres-auth
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  postgres-banking:
    image: postgres:16-alpine
    container_name: passwordless-postgres-banking
    environment:
      POSTGRES_DB: bankingdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: passwordless-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  auth-service:
    build:
      context: ./auth-service
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/authdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-dGVjaHJ1c2gtZGV2LXNlY3JldC1rZXktZm9yLWxvY2FsLWRldmVsb3BtZW50LW9ubHk=}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_FROM: noreply@techrush.dev
      FACEID_SERVICE_URL: http://faceid-service:8000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your-google-client-id.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-your-google-client-secret}
    depends_on:
      - postgres-auth
      - mailhog
      - faceid-service

  banking-service:
    build:
      context: ./banking-service
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-banking:5432/bankingdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-dGVjaHJ1c2gtZGV2LXNlY3JldC1rZXktZm9yLWxvY2FsLWRldmVsb3BtZW50LW9ubHk=}
    depends_on:
      - postgres-banking

  api-gateway:
    build:
      context: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - auth-service
      - banking-service
      - faceid-service

  faceid-service:
    build:
      context: ./faceid-service
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
