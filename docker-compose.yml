services:
  # Auth Database
  postgres-auth:
    image: postgres:16-alpine
    container_name: passwordless-postgres-auth
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Banking Database
  postgres-banking:
    image: postgres:16-alpine
    container_name: passwordless-postgres-banking
    environment:
      POSTGRES_DB: bankingdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FaceID Database
  postgres-faceid:
    image: postgres:16-alpine
    container_name: passwordless-postgres-faceid
    environment:
      POSTGRES_DB: faceid
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_faceid_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: passwordless-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  auth-service:
    build:
      context: ./auth-service
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/authdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-dGVjaHJ1c2gtZGV2LXNlY3JldC1rZXktZm9yLWxvY2FsLWRldmVsb3BtZW50LW9ubHk=}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_FROM: noreply@techrush.dev
      FACEID_SERVICE_URL: http://faceid-service:8000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your-google-client-id.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-your-google-client-secret}
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
    depends_on:
      postgres-auth:
        condition: service_healthy
      mailhog:
        condition: service_started

  banking-service:
    build:
      context: ./banking-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-banking:5432/bankingdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-dGVjaHJ1c2gtZGV2LXNlY3JldC1rZXktZm9yLWxvY2FsLWRldmVsb3BtZW50LW9ubHk=}
    depends_on:
      postgres-banking:
        condition: service_healthy

  faceid-service:
    build: ./faceid-service
    container_name: faceid-service
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-faceid:5432/faceid
      - JWT_SECRET=${JWT_SECRET:-dGVjaHJ1c2gtZGV2LXNlY3JldC1rZXktZm9yLWxvY2FsLWRldmVsb3BtZW50LW9ubHk=}
      - DEBUG=true
      - LOG_LEVEL=INFO
    depends_on:
      postgres-faceid:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./faceid-service:/app

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_GATEWAY_MVC_ROUTES_0_URI: http://auth-service:8080
      SPRING_CLOUD_GATEWAY_MVC_ROUTES_1_URI: http://banking-service:8082
      SPRING_CLOUD_GATEWAY_MVC_ROUTES_2_URI: http://faceid-service:8000
    depends_on:
      - auth-service
      - banking-service
      - faceid-service
    restart: unless-stopped

volumes:
  postgres_faceid_data:
  insightface_cache:
