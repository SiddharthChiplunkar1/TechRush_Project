services:
  # Auth Database
  postgres-auth:
    image: postgres:16-alpine
    container_name: passwordless-postgres-auth
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Banking Database
  postgres-banking:
    image: postgres:16-alpine
    container_name: passwordless-postgres-banking
    environment:
      POSTGRES_DB: bankingdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FaceID Database
  postgres-faceid:
    image: postgres:16-alpine
    container_name: passwordless-postgres-faceid
    environment:
      POSTGRES_DB: faceid
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_faceid_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: passwordless-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  auth-service:
    build:
      context: ./auth-service
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/authdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-dGVjaHJ1c2gtZGV2LXNlY3JldC1rZXktZm9yLWxvY2FsLWRldmVsb3BtZW50LW9ubHk=}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token-change-before-production}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_FROM: noreply@techrush.dev
      FACEID_SERVICE_URL: http://faceid-service:8000
      FACEID_SERVICE_TOKEN: ${FACEID_SERVICE_TOKEN:-dev-faceid-service-token}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your-google-client-id.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-your-google-client-secret}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:5173/login/google}
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
    depends_on:
      postgres-auth:
        condition: service_healthy
      mailhog:
        condition: service_started

  banking-service:
    build:
      context: ./banking-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-banking:5432/bankingdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-dGVjaHJ1c2gtZGV2LXNlY3JldC1rZXktZm9yLWxvY2FsLWRldmVsb3BtZW50LW9ubHk=}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token-change-before-production}
      BANKING_DEMO_AUTO_CREATE_ACCOUNTS: "true"
      BANKING_DEMO_BALANCE: ${BANKING_DEMO_BALANCE:-2500.00}
    depends_on:
      postgres-banking:
        condition: service_healthy

  faceid-service:
    build: ./faceid-service
    container_name: faceid-service
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-faceid:5432/faceid
      - JWT_SECRET=${JWT_SECRET:-dGVjaHJ1c2gtZGV2LXNlY3JldC1rZXktZm9yLWxvY2FsLWRldmVsb3BtZW50LW9ubHk=}
      - FACEID_SERVICE_TOKEN=${FACEID_SERVICE_TOKEN:-dev-faceid-service-token}
      - FACE_MATCHER=arcface
      - INSIGHTFACE_MODEL=buffalo_l
      - INSIGHTFACE_ROOT=/models/insightface
      - DEBUG=true
      - LOG_LEVEL=INFO
    depends_on:
      postgres-faceid:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./faceid-service:/app
      - insightface_models:/models/insightface

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:4173,http://localhost:5173
      # These must match the gateway.* properties in application.yml:
      #   gateway.auth-url    → ${AUTH_SERVICE_URL:http://auth-service:8080}
      #   gateway.banking-url → ${BANKING_SERVICE_URL:http://banking-service:8082}
      #   gateway.face-url    → ${FACEID_SERVICE_URL:http://faceid-service:8000}
      # The previous SPRING_CLOUD_GATEWAY_MVC_ROUTES_* variables were for Spring Cloud
      # Gateway (a different library) and had no effect on this custom RestTemplate proxy.
      AUTH_SERVICE_URL: http://auth-service:8080
      BANKING_SERVICE_URL: http://banking-service:8082
      FACEID_SERVICE_URL: http://faceid-service:8000
      FACEID_SERVICE_TOKEN: ${FACEID_SERVICE_TOKEN:-dev-faceid-service-token}
    depends_on:
      - auth-service
      - banking-service
      - faceid-service
    restart: unless-stopped

volumes:
  postgres_faceid_data:
  insightface_cache:
  insightface_models:
